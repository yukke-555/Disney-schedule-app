<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Disney Planner Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div class="app-container">
        <div class="top-section">
            <div class="section-header">
                <span>タイムスケジュール</span>
                <button id="group-btn" onclick="openGroupModal()">共有</button>
            </div>
            <div id="timeline-container" class="timeline"></div>
        </div>

        <div class="bottom-section">
            <div class="tab-bar">
                <button class="tab-btn active" id="tab-list-btn" onclick="switchTab('list')">施設一覧</button>
                <button class="tab-btn" id="tab-map-btn" onclick="switchTab('map')">マップ</button>
            </div>

            <div id="list-view" class="view-content active">
                <div class="filter-area">
                    <input type="text" id="search-input" placeholder="施設名で検索..." oninput="filterItems()">
                    <div class="filter-buttons">
                        <button class="filter-btn" id="btn-land" onclick="setPark('LAND')">ランド</button>
                        <button class="filter-btn" id="btn-sea" onclick="setPark('SEA')">シー</button>
                    </div>
                    <select id="category-select" onchange="filterItems()">
                        <option value="ALL">すべてのカテゴリー</option>
                        <option value="アトラクション">アトラクション</option>
                        <option value="レストラン">レストラン・ワゴン</option>
                        <option value="ショー">ショー・パレード</option>
                    </select>
                </div>
                <div id="item-list" class="item-grid"></div>
            </div>

           <!-- マップ表示エリア -->
 <div id="map-view" class="view-content">
    <div id="map" style="width: 100%; height: 500px;"></div>
 </div>
            </div>
        </div>
    </div>
    
    <div id="group-modal" class="modal">
        <div class="modal-content">
            <h3>プランを共有する</h3>
            <div id="group-initial-menu">
                <p>現在の予定をURLにして書き出します。</p>
                <button class="menu-btn" onclick="createShareUrl()">招待URLを発行</button>
            </div>
            <div id="group-result-display" style="display:none;">
                <p>URLをコピーしてLINE等で送ってください：</p>
                <textarea id="share-url-display" readonly></textarea>
                <button class="action-btn" onclick="copyUrl()">URLをコピー</button>
            </div>
            <button class="close-btn" onclick="closeGroupModal()">閉じる</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
